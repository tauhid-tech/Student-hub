<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column; /* Stacks everything vertically from top to bottom */
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
    }

    .container {
      background: #1e293b;
      width: 100%;
      max-width: 480px;
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: -0.5px;
    }

    .header p {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 6px;
    }

    .grid-menu {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-card {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 18px 20px;
      border-radius: 18px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .menu-card:hover {
      border-color: #38bdf8;
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .card-icon {
      font-size: 28px;
      background: #1e293b;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      border: 1px solid #334155;
    }

    .card-text h3 {
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 4px;
    }

    .card-text p {
      font-size: 12px;
      color: #94a3b8;
    }

    .arrow {
      color: #38bdf8;
      font-size: 18px;
      font-weight: 800;
    }

    .ad-container {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 50px;
      width: 100%;
      overflow: hidden;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
    }

    .footer span {
      color: #38bdf8;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Top Header -->
    <div class="header">
      <h1>Student Hub</h1>
      <p>Board Exam MCQ Practice & Utility Tools</p>
    </div>

    <!-- Navigation List -->
    <div class="grid-menu">
      
      <!-- 1. Practice Arena -->
      <a href="practice.html" class="menu-card">
        <div class="card-left">
          <div class="card-icon">🎯</div>
          <div class="card-text">
            <h3>Practice Arena</h3>
            <p>Subject Chapters & MCQ Quizzes</p>
          </div>
        </div>
        <span class="arrow">➔</span>
      </a>

      <!-- 2. Calculator -->
      <a href="calc.html" class="menu-card">
        <div class="card-left">
          <div class="card-icon">🧮</div>
          <div class="card-text">
            <h3>Calculator</h3>
            <p>Calculations & Math Tool</p>
          </div>
        </div>
        <span class="arrow">➔</span>
      </a>

      <!-- 3. Timer -->
      <a href="timer.html" class="menu-card">
        <div class="card-left">
          <div class="card-icon">⏱️</div>
          <div class="card-text">
            <h3>Study Timer</h3>
            <p>Focus Stopwatch & Lap Tracking</p>
          </div>
        </div>
        <span class="arrow">➔</span>
      </a>

    </div>

    <!-- Centered Ad Banner -->
    <div class="ad-container">
      <script>
        atOptions = {
          'key' : 'e47b7549d4a248b4adbd6d8af46d85aa',
          'format' : 'iframe',
          'height' : 50,
          'width' : 320,
          'params' : {}
        };
      </script>
      <script src="https://www.highperformanceformat.com/e47b7549d4a248b4adbd6d8af46d85aa/invoke.js"></script>
    </div>

    <!-- Footer -->
    <div class="footer">
      Made with ❤️ by <span>Tauhid</span>
    </div>

  </div>

</body>
</html>
