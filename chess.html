<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Arena - Real-Time 1v1 & AI | Tauhid Tech</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Fira+Code:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --accent: #38bdf8;
      --green: #4ade80;
      --yellow: #facc15;
      --purple: #818cf8;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #243454;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: rgba(21, 29, 48, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand { display: flex; align-items: center; gap: 0.6rem; font-weight: 800; font-size: 1.15rem; color: var(--accent); text-decoration: none; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.9rem; margin-left: 1rem; }
    .nav-links a:hover { color: var(--accent); }

    .container { max-width: 950px; margin: 1.5rem auto; padding: 0 1rem; width: 100%; flex: 1; }

    .profile-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .profile-info { display: flex; align-items: center; gap: 0.75rem; }
    .avatar-icon { font-size: 1.4rem; background: rgba(56, 189, 248, 0.15); color: var(--accent); width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .profile-name { font-weight: 700; font-size: 0.95rem; }
    .elo-tag { background: rgba(250, 204, 21, 0.15); color: var(--yellow); padding: 3px 8px; border-radius: 6px; font-weight: 800; font-size: 0.8rem; margin-left: 0.4rem; }

    .mode-selector { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .mode-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.55rem 1rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: 0.2s;
    }
    .mode-btn.active { background: rgba(56, 189, 248, 0.15); border-color: var(--accent); color: var(--accent); }

    .online-room-card {
      background: #0f172a;
      border: 1px dashed var(--accent);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.25rem;
      display: block;
      text-align: center;
    }

    .room-actions { display: flex; gap: 0.5rem; justify-content: center; margin-top: 0.75rem; flex-wrap: wrap; }
    .room-input { background: #070a12; border: 1px solid var(--border); color: #fff; padding: 0.5rem 0.75rem; border-radius: 8px; font-size: 0.9rem; width: 140px; text-align: center; text-transform: uppercase; }

    .game-layout { display: grid; grid-template-columns: 1fr 320px; gap: 1.5rem; align-items: start; }
    @media (max-width: 768px) { .game-layout { grid-template-columns: 1fr; } }

    .board-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1rem;
      display: flex;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    #myBoard { width: 100%; max-width: 440px; touch-action: none; }

    .panel-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
    .status-badge { background: #070a12; border: 1px solid var(--border); padding: 0.75rem; border-radius: 8px; font-size: 0.92rem; font-weight: 700; color: var(--yellow); text-align: center; }

    .player-indicator { display: flex; justify-content: space-between; background: #070a12; border: 1px solid var(--border); padding: 0.75rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; }
    .player-tag { opacity: 0.5; transition: 0.2s; display: flex; align-items: center; gap: 0.35rem; }
    .player-tag.active { opacity: 1; color: var(--accent); }

    .move-history { background: #070a12; border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem; height: 120px; overflow-y: auto; font-family: 'Fira Code', monospace; font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; }

    .btn-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .btn { background: var(--accent); color: #0b0f19; border: none; padding: 0.65rem 1rem; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .btn.whatsapp { background: #22c55e; color: #fff; }
    .btn.secondary { background: #334155; color: #fff; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center; z-index: 1000; padding: 1rem;
    }
    .modal-box { background: #111827; border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 380px; padding: 1.5rem; text-align: center; }
    .modal-box input { width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border); background: #070a12; color: #fff; font-size: 0.95rem; margin: 0.8rem 0; outline: none; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand">
      <i class="fa-solid fa-chess-knight"></i>
      <span>Tauhid Tech <span style="font-weight:400; font-size:0.85rem; color:#fff;">| Chess 1v1</span></span>
    </a>
    <div class="nav-links">
      <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
      <a href="practice.html"><i class="fa-solid fa-book"></i> Practice</a>
      <a href="papers.html"><i class="fa-solid fa-file-pdf"></i> Papers</a>
    </div>
  </header>

  <div class="container">
    
    <div class="profile-bar">
      <div class="profile-info">
        <div class="avatar-icon"><i class="fa-solid fa-user-astronaut"></i></div>
        <div>
          <span class="profile-name" id="display-user-name">Player</span>
          <span class="elo-tag" id="display-user-elo">1200 ELO</span>
        </div>
      </div>
      <button class="mode-btn" onclick="openProfileModal()"><i class="fa-solid fa-pen-to-square"></i> Change Name</button>
    </div>

    <div class="mode-selector">
      <button class="mode-btn active" id="btn-mode-online" onclick="switchMode('online')">
        <i class="fa-solid fa-earth-americas"></i> Real 1v1 Online
      </button>
      <button class="mode-btn" id="btn-mode-ai" onclick="switchMode('ai')">
        <i class="fa-solid fa-robot"></i> Play Bot (1200)
      </button>
      <button class="mode-btn" id="btn-mode-pvp" onclick="switchMode('pvp')">
        <i class="fa-solid fa-user-group"></i> Pass & Play
      </button>
    </div>

    <div class="online-room-card" id="online-panel">
      <h3 style="font-size:1rem; color:#fff; margin-bottom:0.3rem;"><i class="fa-solid fa-tower-broadcast" style="color:var(--accent);"></i> Real-Time Online 1v1 Room</h3>
      <p style="font-size:0.8rem; color:var(--text-muted);">Create a room or join your friend's 5-digit code:</p>
      
      <div class="room-actions">
        <button class="btn" onclick="createOnlineRoom()"><i class="fa-solid fa-plus"></i> Create Room</button>
        <button class="btn whatsapp" id="btn-share-wa" style="display:none;" onclick="shareOnWhatsApp()"><i class="fa-brands fa-whatsapp"></i> WhatsApp Invite</button>
        <input type="text" class="room-input" id="join-room-code" placeholder="ROOM CODE" maxlength="6">
        <button class="btn secondary" onclick="joinOnlineRoom()"><i class="fa-solid fa-right-to-bracket"></i> Join</button>
      </div>
      <div id="connection-status" style="font-size:0.85rem; font-weight:700; color:var(--accent); margin-top:0.6rem;"></div>
    </div>

    <div class="game-layout">
      <div class="board-card">
        <div id="myBoard"></div>
      </div>

      <div class="panel-card">
        <div class="status-badge" id="status-display">White's Turn</div>

        <div class="player-indicator">
          <div class="player-tag active" id="white-tag">
            <i class="fa-solid fa-circle" style="color:#fff;"></i> <span id="p1-label">Player 1</span> (<span id="p1-elo">1200</span>)
          </div>
          <div class="player-tag" id="black-tag">
            <i class="fa-solid fa-circle" style="color:#64748b;"></i> <span id="p2-label">Player 2</span> (<span id="p2-elo">1200</span>)
          </div>
        </div>

        <div>
          <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-bottom:0.3rem;">MOVE LOG:</div>
          <div class="move-history" id="pgn-log">> Game initialized...</div>
        </div>

        <div class="btn-group">
          <button class="btn" onclick="resetGame()"><i class="fa-solid fa-rotate-left"></i> Restart Board</button>
          <button class="btn secondary" onclick="board.flip()"><i class="fa-solid fa-arrows-rotate"></i> Flip View</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="profile-modal">
    <div class="modal-box">
      <h3 style="color:#fff; font-size:1.1rem; margin-bottom:0.25rem;">Enter Your Name</h3>
      <p style="color:var(--text-muted); font-size:0.8rem;">Save your display name for 1v1 matches</p>
      <input type="text" id="input-username" placeholder="Your Name" maxlength="15">
      <button class="btn" style="width:100%;" onclick="saveProfile()"><i class="fa-solid fa-check"></i> Save Name</button>
    </div>
  </div>

  <!-- Dependencies -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  
  <!-- Firebase SDK for 100% Reliable Cloud Real-Time Sync -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
        let board = null;
    let game = new Chess();
    let currentMode = 'online';
    let myColor = 'w';
    let currentRoomCode = "";
    let client = null;
    let myClientId = 'user_' + Math.random().toString(36).substring(2, 9);

    let playerName = localStorage.getItem('chess_username') || "Player";
    let playerElo = parseInt(localStorage.getItem('chess_elo')) || 1200;

    function initProfile() {
      document.getElementById('display-user-name').innerText = playerName;
      document.getElementById('display-user-elo').innerText = `${playerElo} ELO`;
      document.getElementById('p1-label').innerText = playerName;
      document.getElementById('p1-elo').innerText = playerElo;
    }

    function openProfileModal() {
      document.getElementById('input-username').value = playerName;
      document.getElementById('profile-modal').style.display = 'flex';
    }

    function saveProfile() {
      const val = document.getElementById('input-username').value.trim();
      if (val) {
        playerName = val;
        localStorage.setItem('chess_username', playerName);
        initProfile();
      }
      document.getElementById('profile-modal').style.display = 'none';
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-online').classList.toggle('active', mode === 'online');
      document.getElementById('btn-mode-ai').classList.toggle('active', mode === 'ai');
      document.getElementById('btn-mode-pvp').classList.toggle('active', mode === 'pvp');
      document.getElementById('online-panel').style.display = (mode === 'online') ? 'block' : 'none';

      myColor = 'w';
      board.orientation('white');

      if (mode === 'ai') {
        document.getElementById('p2-label').innerText = "Logic Bot";
        document.getElementById('p2-elo').innerText = "1200";
      } else if (mode === 'pvp') {
        document.getElementById('p2-label').innerText = "Guest";
        document.getElementById('p2-elo').innerText = "1200";
      }
      resetGame();
    }

    /* --- REAL-TIME WEBSOCKET ROOM ENGINE --- */
    function connectMQTT(roomCode, isHost) {
      document.getElementById('connection-status').innerText = "Connecting to game server...";

      if (client) {
        try { client.end(true); } catch(e){}
      }
      
      client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
        clientId: myClientId,
        clean: true,
        connectTimeout: 5000
      });

      const topic = `tauhid/chess/${roomCode}`;

      client.on('connect', () => {
        client.subscribe(topic, (err) => {
          if (!err) {
            if (isHost) {
              document.getElementById('connection-status').innerHTML = `Room Code: <b style="color:var(--yellow); font-size:1.1rem;">${roomCode}</b>. Waiting for friend to join...`;
              document.getElementById('btn-share-wa').style.display = 'inline-flex';
            } else {
              setTimeout(() => {
                client.publish(topic, JSON.stringify({
                  type: 'join',
                  sender: myClientId,
                  name: playerName,
                  elo: playerElo
                }));
              }, 300);
              document.getElementById('connection-status').innerText = `⚡ Connected to Room ${roomCode}! You are Black.`;
            }
          }
        });
      });

      client.on('message', (t, message) => {
        try {
          const payload = JSON.parse(message.toString());
          if (payload.sender === myClientId) return;

          if (payload.type === 'join' && isHost) {
            document.getElementById('p2-label').innerText = payload.name || "Opponent";
            document.getElementById('p2-elo').innerText = payload.elo || "1200";
            document.getElementById('connection-status').innerText = `⚡ Friend Connected! Match Started. You are White.`;

            client.publish(topic, JSON.stringify({
              type: 'ack',
              sender: myClientId,
              name: playerName,
              elo: playerElo
            }));
          } else if (payload.type === 'ack' && !isHost) {
            document.getElementById('p1-label').innerText = payload.name || "Host";
            document.getElementById('p1-elo').innerText = payload.elo || "1200";
            document.getElementById('connection-status').innerText = `⚡ Match Started! You are Black.`;
          } else if (payload.type === 'move') {
            game.move(payload.move);
            board.position(game.fen());
            updateStatus();
          } else if (payload.type === 'reset') {
            game.reset();
            board.start();
            updateStatus();
          }
        } catch(err) {
          console.error(err);
        }
      });

      client.on('error', (err) => {
        document.getElementById('connection-status').innerText = "Connection error. Retrying...";
      });
    }

    function createOnlineRoom() {
      const code = Math.random().toString(36).substring(2, 7).toUpperCase();
      currentRoomCode = code;
      myColor = 'w';
      board.orientation('white');
      connectMQTT(code, true);
    }

    function joinOnlineRoom(autoCode) {
      const code = (autoCode || document.getElementById('join-room-code').value).trim().toUpperCase();
      if (!code) {
        alert("Please enter a room code first.");
        return;
      }

      currentRoomCode = code;
      myColor = 'b';
      board.orientation('black');
      connectMQTT(code, false);
    }
        /* --- GAMEPLAY ENGINE & EVENT HANDLERS --- */
    function onDragStart(source, piece) {
      if (game.game_over()) return false;

      if (currentMode === 'online') {
        if (!client || !client.connected) return false;
        if ((myColor === 'w' && piece.search(/^b/) !== -1) || (myColor === 'b' && piece.search(/^w/) !== -1)) return false;
        if ((myColor === 'w' && game.turn() !== 'w') || (myColor === 'b' && game.turn() !== 'b')) return false;
      }

      if (currentMode === 'ai' && piece.search(/^b/) !== -1) return false;

      if (currentMode === 'pvp') {
        if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
            (game.turn() === 'b' && piece.search(/^w/) !== -1)) return false;
      }
    }

    function makeAIMove() {
      const possibleMoves = game.moves();
      if (possibleMoves.length === 0) return;

      let captureMoves = possibleMoves.filter(m => m.includes('x') || m.includes('+'));
      let selectedMove = captureMoves.length > 0 
        ? captureMoves[Math.floor(Math.random() * captureMoves.length)]
        : possibleMoves[Math.floor(Math.random() * possibleMoves.length)];

      game.move(selectedMove);
      board.position(game.fen());
      updateStatus();
    }

    function onDrop(source, target) {
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';

      updateStatus();

      if (currentMode === 'online' && client && client.connected) {
        client.publish(`tauhid/chess/${currentRoomCode}`, JSON.stringify({
          type: 'move',
          sender: myClientId,
          move: { from: source, to: target, promotion: 'q' }
        }));
      }

      if (currentMode === 'ai' && !game.game_over()) {
        window.setTimeout(makeAIMove, 300);
      }
    }

    function onSnapEnd() { board.position(game.fen()); }

    function updateStatus() {
      const turn = game.turn();
      const isWhite = (turn === 'w');

      document.getElementById('white-tag').classList.toggle('active', isWhite);
      document.getElementById('black-tag').classList.toggle('active', !isWhite);

      let status = isWhite ? "White's Turn" : "Black's Turn";
      if (currentMode === 'online') {
        status = (game.turn() === myColor) ? "🟢 Your Turn" : "⏳ Opponent is thinking...";
      }

      if (game.in_checkmate()) {
        const winner = isWhite ? 'Black' : 'White';
        status = `🏆 Checkmate! ${winner} Wins!`;
      } else if (game.in_draw()) {
        status = '🤝 Draw Game!';
      } else if (game.in_check()) {
        status += ' (CHECK!)';
      }

      document.getElementById('status-display').innerText = status;
      document.getElementById('pgn-log').innerText = game.pgn() || '> Game initialized...';
      document.getElementById('pgn-log').scrollTop = document.getElementById('pgn-log').scrollHeight;
    }

    function resetGame() {
      game.reset();
      board.start();
      updateStatus();
      if (currentMode === 'online' && client && client.connected) {
        client.publish(`tauhid/chess/${currentRoomCode}`, JSON.stringify({
          type: 'reset',
          sender: myClientId
        }));
      }
    }

    function shareOnWhatsApp() {
      const currentUrl = window.location.href.split('?')[0];
      const inviteMsg = `⚔️ Challenge me in Chess on Student Hub!\nRoom Code: *${currentRoomCode}*\nPlay here: ${currentUrl}?room=${currentRoomCode}`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(inviteMsg)}`, '_blank');
    }

    const config = {
      draggable: true,
      position: 'start',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd,
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    };

    board = Chessboard('myBoard', config);
    $(window).resize(board.resize);

    window.onload = () => {
      initProfile();
      updateStatus();

      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam) {
        document.getElementById('join-room-code').value = roomParam;
        joinOnlineRoom(roomParam);
      }
    };
    
</script>
</body>
</html>
