<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Focus Timer | Student Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #1e293b;
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      text-align: center;
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .back-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      background: #334155;
      padding: 6px 14px;
      border-radius: 12px;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: #475569;
      color: #fff;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: #f8fafc;
    }

    /* Mode Selector Buttons */
    .mode-switch {
      display: flex;
      background: #0f172a;
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 30px;
      gap: 4px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-weight: 600;
      font-size: 13px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: #38bdf8;
      color: #0f172a;
    }

    /* Circular Display */
    .timer-circle-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-display {
      font-size: 54px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
    }

    .timer-label {
      position: absolute;
      bottom: 45px;
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      flex: 1;
      padding: 14px 0;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .start-btn {
      background: #38bdf8;
      color: #0f172a;
    }

    .start-btn:hover {
      background: #7dd3fc;
    }

    .pause-btn {
      background: #f59e0b;
      color: #0f172a;
    }

    .reset-btn {
      background: #334155;
      color: #cbd5e1;
    }

    .reset-btn:hover {
      background: #475569;
    }

    /* Sound indicator */
    .status-msg {
      margin-top: 18px;
      font-size: 13px;
      color: #64748b;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-nav">
      <a href="index.html" class="back-btn">← Home</a>
      <div class="title">Focus Timer</div>
      <div style="width: 58px;"></div>
    </div>

    <!-- Modes -->
    <div class="mode-switch">
      <button class="mode-btn active" data-mode="pomodoro" data-time="1500">Pomodoro (25m)</button>
      <button class="mode-btn" data-mode="short" data-time="300">Short (5m)</button>
      <button class="mode-btn" data-mode="long" data-time="900">Long (15m)</button>
    </div>

    <!-- Timer Display -->
    <div class="timer-circle-wrapper">
      <div class="timer-display" id="timeDisplay">25:00</div>
      <div class="timer-label" id="modeLabel">Focus Session</div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn start-btn" id="startPauseBtn">Start</button>
      <button class="btn reset-btn" id="resetBtn">Reset</button>
    </div>

    <div class="status-msg" id="statusMsg">Timer will continue even if you leave or refresh.</div>
  </div>

  <script>
    // State Variables
    let modeDurations = {
      pomodoro: 25 * 60,
      short: 5 * 60,
      long: 15 * 60
    };

    let currentMode = localStorage.getItem('study_timer_mode') || 'pomodoro';
    let defaultTime = modeDurations[currentMode];
    let remainingTime = defaultTime;
    let isRunning = false;
    let timerInterval = null;

    const timeDisplay = document.getElementById('timeDisplay');
    const modeLabel = document.getElementById('modeLabel');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const modeButtons = document.querySelectorAll('.mode-btn');

    // Beep sound function when timer completes
    function playAlarm() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.2); // A5
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      } catch (e) {
        console.log("Audio alert not allowed without interaction.");
      }
    }

    // Format mm:ss
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // Update display & document title
    function updateUI() {
      timeDisplay.textContent = formatTime(remainingTime);
      document.title = `${formatTime(remainingTime)} - Study Timer`;
      
      const labels = {
        pomodoro: 'Focus Session',
        short: 'Short Break',
        long: 'Long Break'
      };
      modeLabel.textContent = labels[currentMode];

      modeButtons.forEach(btn => {
        if (btn.getAttribute('data-mode') === currentMode) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      if (isRunning) {
        startPauseBtn.textContent = 'Pause';
        startPauseBtn.className = 'btn pause-btn';
      } else {
        startPauseBtn.textContent = 'Start';
        startPauseBtn.className = 'btn start-btn';
      }
    }

    // Sync from LocalStorage on page load/refresh
    function syncFromStorage() {
      currentMode = localStorage.getItem('study_timer_mode') || 'pomodoro';
      defaultTime = modeDurations[currentMode];
      
      const storedEndTime = localStorage.getItem('study_timer_end_time');
      const storedRemaining = localStorage.getItem('study_timer_remaining');
      const storedIsRunning = localStorage.getItem('study_timer_running') === 'true';

      if (storedIsRunning && storedEndTime) {
        const now = Date.now();
        const endTime = parseInt(storedEndTime, 10);
        const diffSeconds = Math.round((endTime - now) / 1000);

        if (diffSeconds > 0) {
          remainingTime = diffSeconds;
          isRunning = true;
          startTick();
        } else {
          // Timer finished while user was away
          remainingTime = 0;
          isRunning = false;
          clearStorageState();
          playAlarm();
        }
      } else if (storedRemaining !== null) {
        remainingTime = parseInt(storedRemaining, 10);
        isRunning = false;
      } else {
        remainingTime = defaultTime;
        isRunning = false;
      }

      updateUI();
    }

    function clearStorageState() {
      localStorage.removeItem('study_timer_end_time');
      localStorage.removeItem('study_timer_remaining');
      localStorage.setItem('study_timer_running', 'false');
    }

    function startTick() {
      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        const endTime = parseInt(localStorage.getItem('study_timer_end_time'), 10);
        const now = Date.now();
        const diff = Math.round((endTime - now) / 1000);

        if (diff <= 0) {
          clearInterval(timerInterval);
          remainingTime = 0;
          isRunning = false;
          clearStorageState();
          updateUI();
          playAlarm();
          alert('⏰ Session Complete! Take a break.');
        } else {
          remainingTime = diff;
          updateUI();
        }
      }, 500);
    }

    // Start / Pause
    startPauseBtn.addEventListener('click', () => {
      if (isRunning) {
        // Pausing
        clearInterval(timerInterval);
        isRunning = false;
        localStorage.setItem('study_timer_running', 'false');
        localStorage.setItem('study_timer_remaining', remainingTime);
        localStorage.removeItem('study_timer_end_time');
      } else {
        // Starting
        if (remainingTime <= 0) remainingTime = defaultTime;
        
        const targetEndTime = Date.now() + (remainingTime * 1000);
        localStorage.setItem('study_timer_end_time', targetEndTime);
        localStorage.setItem('study_timer_running', 'true');
        isRunning = true;
        startTick();
      }
      updateUI();
    });

    // Reset
    resetBtn.addEventListener('click', () => {
      clearInterval(timerInterval);
      isRunning = false;
      defaultTime = modeDurations[currentMode];
      remainingTime = defaultTime;
      clearStorageState();
      updateUI();
    });

    // Switch Modes (Pomodoro / Short / Long)
    modeButtons.forEach(button => {
      button.addEventListener('click', () => {
        clearInterval(timerInterval);
        isRunning = false;
        currentMode = button.getAttribute('data-mode');
        localStorage.setItem('study_timer_mode', currentMode);
        defaultTime = modeDurations[currentMode];
        remainingTime = defaultTime;
        clearStorageState();
        updateUI();
      });
    });

    // Run sync on startup
    syncFromStorage();
  </script>
</body>
</html>
