<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Study Timer | Student Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px 60px;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    /* Navigation Bar */
    nav {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
      background: var(--card-bg);
      padding: 10px 16px;
      border-radius: 9999px;
      border: 1px solid var(--border);
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: color 0.2s;
    }

    nav a.active {
      color: var(--primary);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(59, 130, 246, 0.15);
      color: var(--primary);
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 30px 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Mode Selector Buttons */
    .mode-group {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .mode-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    /* Timer Display */
    .timer-display {
      font-size: 4rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: 2px;
      margin: 10px 0 24px;
      font-variant-numeric: tabular-nums;
    }

    /* Controls */
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      min-width: 110px;
    }

    .btn-start {
      background-color: var(--accent);
      color: white;
    }

    .btn-pause {
      background-color: #eab308;
      color: #0f172a;
    }

    .btn-reset {
      background-color: #334155;
      color: var(--text);
    }

    .btn-reset:hover {
      background-color: #475569;
    }

    /* Stats Box */
    .stats {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
    }

    .stats span {
      color: var(--accent);
      font-weight: 700;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navigation Bar -->
    <nav>
      <a href="index.html">📊 Calculator</a>
      <a href="timer.html" class="active">⏱️ Study Timer</a>
    </nav>

    <header>
      <div class="badge">Focus Booster</div>
      <h1>Pomodoro Study Timer</h1>
      <p>Study with full focus in 25-minute intervals.</p>
    </header>

    <div class="card">
      <div class="mode-group">
        <button class="mode-btn active" onclick="setMode('study', 25, this)">Focus (25m)</button>
        <button class="mode-btn" onclick="setMode('shortBreak', 5, this)">Short Break (5m)</button>
        <button class="mode-btn" onclick="setMode('longBreak', 15, this)">Long Break (15m)</button>
      </div>

      <div class="timer-display" id="time">25:00</div>

      <div class="btn-group">
        <button class="btn btn-start" id="start-btn" onclick="toggleTimer()">Start</button>
        <button class="btn btn-reset" onclick="resetTimer()">Reset</button>
      </div>

      <div class="stats">
        Completed Study Sessions: <span id="session-count">0</span>
      </div>
    </div>

    <footer>
      <p>Student Utility Hub • Built for productivity</p>
    </footer>
  </div>

  <script>
    let timer;
    let isRunning = false;
    let totalSeconds = 25 * 60;
    let defaultSeconds = 25 * 60;
    let completedSessions = 0;
    let currentMode = 'study';

    const timeDisplay = document.getElementById('time');
    const startBtn = document.getElementById('start-btn');
    const sessionDisplay = document.getElementById('session-count');

    function updateDisplay() {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      const formatted = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      timeDisplay.textContent = formatted;
      document.title = `${formatted} - Pomodoro Timer`;
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timer);
        isRunning = false;
        startBtn.textContent = 'Resume';
        startBtn.className = 'btn btn-start';
      } else {
        isRunning = true;
        startBtn.textContent = 'Pause';
        startBtn.className = 'btn btn-pause';
        timer = setInterval(() => {
          if (totalSeconds > 0) {
            totalSeconds--;
            updateDisplay();
          } else {
            clearInterval(timer);
            isRunning = false;
            startBtn.textContent = 'Start';
            startBtn.className = 'btn btn-start';
            alert(currentMode === 'study' ? '🎉 Focus session complete! Time for a break.' : '⏰ Break is over! Ready to study?');
            if (currentMode === 'study') {
              completedSessions++;
              sessionDisplay.textContent = completedSessions;
            }
            resetTimer();
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timer);
      isRunning = false;
      totalSeconds = defaultSeconds;
      startBtn.textContent = 'Start';
      startBtn.className = 'btn btn-start';
      updateDisplay();
    }

    function setMode(mode, minutes, btn) {
      currentMode = mode;
      defaultSeconds = minutes * 60;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      resetTimer();
    }

    updateDisplay();
  </script>
</body>
</html>
