<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1v1 Friends Battle | Student Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      background: #1e293b;
      width: 100%;
      max-width: 480px;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      text-align: center;
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      background: #334155;
      padding: 6px 14px;
      border-radius: 12px;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }

    .back-btn:hover { background: #475569; color: #fff; }
    .title { font-size: 17px; font-weight: 700; color: #f8fafc; }

    /* SUBJECT SELECTOR */
    .section-label {
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
      text-align: left;
    }

    .subject-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .subject-card {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 16px 12px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .subject-card:hover {
      border-color: #38bdf8;
      transform: translateY(-2px);
    }

    .subject-card.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
    }

    .sub-icon { font-size: 26px; }
    .sub-name { font-size: 14px; font-weight: 700; color: #f8fafc; }

    /* MATCHMAKING RADAR */
    .radar-box {
      margin: 30px auto;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.1);
      border: 2px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: pulse 1.5s infinite;
    }

    .radar-icon { font-size: 38px; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.6); }
      70% { box-shadow: 0 0 0 26px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }

    /* BATTLE SCOREBOARD */
    .battle-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 20px;
    }

    .player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .player-name { font-size: 13px; font-weight: 700; color: #94a3b8; }
    .player-score { font-size: 22px; font-weight: 800; color: #38bdf8; }
    .opponent-score { color: #f87171; }
    .vs-badge { font-size: 14px; font-weight: 800; color: #facc15; }

    .timer-pill {
      background: #334155;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      color: #facc15;
      margin-bottom: 12px;
      display: inline-block;
    }

    .question-box {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 16px;
      text-align: left;
    }

    .question-text {
      font-size: 15px;
      font-weight: 600;
      color: #f8fafc;
      line-height: 1.5;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .opt-btn {
      background: #0f172a;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 13px 15px;
      border-radius: 12px;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }

    .opt-btn:hover:not(:disabled) { border-color: #38bdf8; color: #fff; }
    .opt-btn.correct { background: rgba(34, 197, 94, 0.2) !important; border-color: #22c55e !important; color: #4ade80 !important; font-weight: 700; }
    .opt-btn.wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: #ef4444 !important; color: #f87171 !important; }

    .action-btn {
      width: 100%;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .action-btn:hover { background: #7dd3fc; }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
    }

    .footer span { color: #38bdf8; font-weight: 700; }
  </style>
</head>
<body>

  <div class="container">

    <!-- 1. SUBJECT & MATCHMAKING VIEW -->
    <div id="viewMatchmaking">
      <div class="header-nav">
        <a href="index.html" class="back-btn">← Home</a>
        <div class="title">1v1 Battle Arena</div>
        <div style="width: 50px;"></div>
      </div>

      <div class="section-label">Select Battle Subject</div>
      <div class="subject-grid">
        <div class="subject-card active" onclick="selectSubject('science', this)">
          <span class="sub-icon">🔬</span>
          <span class="sub-name">Science</span>
        </div>
        <div class="subject-card" onclick="selectSubject('maths', this)">
          <span class="sub-icon">📐</span>
          <span class="sub-name">Maths</span>
        </div>
        <div class="subject-card" onclick="selectSubject('english', this)">
          <span class="sub-icon">📖</span>
          <span class="sub-name">English</span>
        </div>
        <div class="subject-card" onclick="selectSubject('all', this)">
          <span class="sub-icon">🎲</span>
          <span class="sub-name">Mixed Quiz</span>
        </div>
      </div>

      <div class="radar-box">
        <span class="radar-icon">⚔️</span>
      </div>

      <h2 id="matchStatus" style="font-size: 17px; margin-bottom: 6px;">Ready to Battle</h2>
      <p id="matchDetail" style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">Choose a subject and find an online opponent</p>

      <button class="action-btn" id="startMatchBtn" onclick="findOpponent()">Find Opponent ➔</button>
    </div>

    <!-- 2. ACTIVE 1v1 BATTLE VIEW -->
    <div id="viewBattle" style="display: none;">
      
      <!-- Live Scores -->
      <div class="battle-header">
        <div class="player-card">
          <span class="player-name">👤 You</span>
          <span class="player-score" id="userScore">0</span>
        </div>
        <span class="vs-badge">VS</span>
        <div class="player-card">
          <span class="player-name" id="opponentName">Opponent</span>
          <span class="player-score opponent-score" id="opponentScore">0</span>
        </div>
      </div>

      <div class="timer-pill" id="roundTimer">⏱️ Round Time: 10s</div>

      <div class="question-box">
        <div class="question-text" id="qText">Loading question...</div>
      </div>

      <div class="options-group" id="optionsContainer"></div>
    </div>

    <!-- 3. RESULT VIEW -->
    <div id="viewBattleResult" style="display: none; padding: 20px 0;">
      <h1 id="resultBanner" style="font-size: 32px; margin-bottom: 10px;">🏆 VICTORY!</h1>
      <p id="resultSummary" style="color: #94a3b8; font-size: 14px; margin-bottom: 24px;">You defeated your opponent!</p>
      
      <button class="action-btn" onclick="location.reload()">Battle Another Subject ⚔️</button>
    </div>

    <!-- Footer -->
    <div class="footer">
      Made with ❤️ by <span>Tauhid</span>
    </div>

  </div>

  <script src="ads.js"></script>

  <script>
    const sampleOpponents = [
      "Aarav S. (Delhi)",
      "Priya P. (Mumbai)",
      "Rohit K. (Kolkata)",
      "Ananya M. (Assam)",
      "Sneha V. (Bangalore)",
      "Aryan D. (Patna)"
    ];

    const questionBanks = {
      science: [
        {
          q: "What is the main constituent gas present in Biogas (up to 75%)?",
          options: ["Methane (CH₄)", "Ethane", "Carbon dioxide", "Hydrogen"],
          answer: "Methane (CH₄)"
        },
        {
          q: "What is the minimum wind speed required for a wind turbine generator?",
          options: ["15 km/h", "5 km/h", "25 km/h", "50 km/h"],
          answer: "15 km/h"
        },
        {
          q: "Which element is primarily used as a semiconductor in making solar cells?",
          options: ["Silicon (Si)", "Carbon (C)", "Aluminium (Al)", "Copper (Cu)"],
          answer: "Silicon (Si)"
        },
        {
          q: "Which mirror is used in solar cookers to concentrate sunlight at a focus point?",
          options: ["Concave mirror", "Convex mirror", "Plane mirror", "Cylindrical mirror"],
          answer: "Concave mirror"
        },
        {
          q: "In a hydroelectric plant, which energy conversion takes place?",
          options: ["Potential → Kinetic → Electrical", "Chemical → Heat", "Nuclear → Mechanical", "Sound → Light"],
          answer: "Potential → Kinetic → Electrical"
        }
      ],
      maths: [
        {
          q: "What is the HCF of 135 and 225 using Euclid's Division Lemma?",
          options: ["45", "15", "5", "9"],
          answer: "45"
        },
        {
          q: "What is the value of sin 30° + cos 60°?",
          options: ["1", "1/2", "√3/2", "0"],
          answer: "1"
        },
        {
          q: "If the discriminant (D = b² - 4ac) of a quadratic equation is > 0, the roots are:",
          options: ["Real and distinct", "Real and equal", "No real roots", "Imaginary only"],
          answer: "Real and distinct"
        },
        {
          q: "What is the 10th term of the AP: 2, 7, 12, ... ?",
          options: ["47", "50", "42", "52"],
          answer: "47"
        },
        {
          q: "What is the distance between points (0, 0) and (3, 4)?",
          options: ["5 units", "7 units", "25 units", "1 unit"],
          answer: "5 units"
        }
      ],
      english: [
        {
          q: "Who is the author of 'A Letter to God'?",
          options: ["G.L. Fuentes", "Liam O'Flaherty", "Frederick Forsyth", "Roald Dahl"],
          answer: "G.L. Fuentes"
        },
        {
          q: "What did Lencho compare the big drops of rain to?",
          options: ["Ten-cent pieces", "Five-cent pieces", "Silver coins", "Pearls"],
          answer: "Ten-cent pieces"
        },
        {
          q: "How much money was the postmaster able to send to Lencho?",
          options: ["70 pesos", "100 pesos", "50 pesos", "75 pesos"],
          answer: "70 pesos"
        },
        {
          q: "Who was described as 'an ox of a man' in First Flight?",
          options: ["Lencho", "The Postmaster", "The Postman", "Mijbil"],
          answer: "Lencho"
        },
        {
          q: "What did Lencho call the post office employees in his second letter?",
          options: ["A bunch of crooks", "Kind angels", "Selfish men", "Helpers of God"],
          answer: "A bunch of crooks"
        }
      ]
    };

    let selectedSubject = 'science';
    let activeQuestions = [];
    let currentQ = 0;
    let userPoints = 0;
    let opponentPoints = 0;
    let roundTime = 10;
    let timerInterval = null;
    let opponentAnswerTimeout = null;

    function selectSubject(sub, cardElement) {
      selectedSubject = sub;
      document.querySelectorAll('.subject-card').forEach(c => c.classList.remove('active'));
      cardElement.classList.add('active');
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function findOpponent() {
      // Build Question set
      if (selectedSubject === 'all') {
        activeQuestions = shuffleArray([
          ...questionBanks.science,
          ...questionBanks.maths,
          ...questionBanks.english
        ]).slice(0, 5);
      } else {
        activeQuestions = shuffleArray(questionBanks[selectedSubject]).slice(0, 5);
      }

      const startBtn = document.getElementById("startMatchBtn");
      startBtn.disabled = true;
      startBtn.style.opacity = "0.5";
      document.getElementById("matchStatus").textContent = `Searching for ${selectedSubject.toUpperCase()} Player...`;

      setTimeout(() => {
        const randomOpponent = sampleOpponents[Math.floor(Math.random() * sampleOpponents.length)];
        document.getElementById("opponentName").textContent = randomOpponent;
        document.getElementById("matchStatus").textContent = `Opponent Found: ${randomOpponent}!`;
        
        setTimeout(() => {
          document.getElementById("viewMatchmaking").style.display = "none";
          document.getElementById("viewBattle").style.display = "block";
          loadRound();
        }, 1200);
      }, 2000);
    }

    function loadRound() {
      clearInterval(timerInterval);
      clearTimeout(opponentAnswerTimeout);

      if (currentQ >= activeQuestions.length) {
        finishBattle();
        return;
      }

      roundTime = 10;
      document.getElementById("roundTimer").textContent = `⏱️ Round Time: ${roundTime}s`;
      
      const q = activeQuestions[currentQ];
      document.getElementById("qText").textContent = `Q${currentQ + 1}: ${q.q}`;

      const container = document.getElementById("optionsContainer");
      container.innerHTML = "";

      const shuffledOpts = shuffleArray(q.options);
      shuffledOpts.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.textContent = opt;
        btn.onclick = () => answerQuestion(btn, opt, q.answer);
        container.appendChild(btn);
      });

      // Opponent simulated delay (3 to 6 seconds)
      const opponentDelay = (Math.floor(Math.random() * 4) + 3) * 1000;
      opponentAnswerTimeout = setTimeout(() => {
        if (Math.random() < 0.8) {
          opponentPoints += 100;
          document.getElementById("opponentScore").textContent = opponentPoints;
        }
      }, opponentDelay);

      // 10-second round timer countdown
      timerInterval = setInterval(() => {
        roundTime--;
        document.getElementById("roundTimer").textContent = `⏱️ Round Time: ${roundTime}s`;
        if (roundTime <= 0) {
          clearInterval(timerInterval);
          currentQ++;
          loadRound();
        }
      }, 1000);
    }

    function answerQuestion(btn, selected, correct) {
      clearInterval(timerInterval);
      const buttons = document.querySelectorAll(".opt-btn");
      buttons.forEach(b => b.disabled = true);

      if (selected === correct) {
        btn.classList.add("correct");
        userPoints += 100 + (roundTime * 5); // Speed bonus
        document.getElementById("userScore").textContent = userPoints;
      } else {
        btn.classList.add("wrong");
        buttons.forEach(b => {
          if (b.textContent === correct) b.classList.add("correct");
        });
      }

      setTimeout(() => {
        currentQ++;
        loadRound();
      }, 1000);
    }

    function finishBattle() {
      document.getElementById("viewBattle").style.display = "none";
      document.getElementById("viewBattleResult").style.display = "block";

      const banner = document.getElementById("resultBanner");
      const summary = document.getElementById("resultSummary");

      if (userPoints > opponentPoints) {
        banner.textContent = "🏆 VICTORY!";
        banner.style.color = "#4ade80";
        summary.textContent = `You won! Final Score: ${userPoints} vs ${opponentPoints}`;
      } else if (userPoints === opponentPoints) {
        banner.textContent = "🤝 IT'S A TIE!";
        banner.style.color = "#facc15";
        summary.textContent = `Equal Score: ${userPoints} - ${opponentPoints}`;
      } else {
        banner.textContent = "💀 DEFEAT";
        banner.style.color = "#f87171";
        summary.textContent = `Opponent won! Final Score: ${userPoints} vs ${opponentPoints}`;
      }
    }
  </script>
</body>
</html>
