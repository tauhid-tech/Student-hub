<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live 1v1 Real-Player Battle | Student Hub</title>
  
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      background: #1e293b;
      width: 100%;
      max-width: 480px;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      text-align: center;
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      background: #334155;
      padding: 6px 14px;
      border-radius: 12px;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }

    .back-btn:hover { background: #475569; color: #fff; }
    .title { font-size: 17px; font-weight: 700; color: #f8fafc; }

    .input-box {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
      text-align: center;
    }
    .input-box:focus { border-color: #38bdf8; }

    .section-label {
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
      text-align: left;
    }

    .subject-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .subject-card {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 14px 10px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .subject-card:hover { border-color: #38bdf8; transform: translateY(-2px); }
    .subject-card.active { border-color: #38bdf8; background: rgba(56, 189, 248, 0.15); }
    .sub-icon { font-size: 24px; }
    .sub-name { font-size: 13px; font-weight: 700; color: #f8fafc; }

    /* MATCHMAKING RADAR */
    .radar-box {
      margin: 24px auto;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.1);
      border: 2px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 1.5s infinite;
    }

    .radar-icon { font-size: 34px; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.6); }
      70% { box-shadow: 0 0 0 24px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }

    /* BATTLE SCOREBOARD */
    .battle-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 20px;
    }

    .player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .player-name { font-size: 13px; font-weight: 700; color: #94a3b8; }
    .player-score { font-size: 22px; font-weight: 800; color: #38bdf8; }
    .opponent-score { color: #f87171; }
    .vs-badge { font-size: 14px; font-weight: 800; color: #facc15; }

    .timer-pill {
      background: #334155;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      color: #facc15;
      margin-bottom: 12px;
      display: inline-block;
    }

    .question-box {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 16px;
      text-align: left;
    }

    .question-text {
      font-size: 15px;
      font-weight: 600;
      color: #f8fafc;
      line-height: 1.5;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .opt-btn {
      background: #0f172a;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 13px 15px;
      border-radius: 12px;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }

    .opt-btn:hover:not(:disabled) { border-color: #38bdf8; color: #fff; }
    .opt-btn.correct { background: rgba(34, 197, 94, 0.2) !important; border-color: #22c55e !important; color: #4ade80 !important; font-weight: 700; }
    .opt-btn.wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: #ef4444 !important; color: #f87171 !important; }

    .action-btn {
      width: 100%;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .action-btn:hover { background: #7dd3fc; }

    .secondary-btn {
      background: #334155;
      color: #f8fafc;
      margin-top: 10px;
    }
    .secondary-btn:hover { background: #475569; }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
    }

    .footer span { color: #38bdf8; font-weight: 700; }
  </style>
</head>
<body>

  <div class="container">

    <!-- 1. MATCHMAKING SCREEN -->
    <div id="viewMatchmaking">
      <div class="header-nav">
        <a href="index.html" class="back-btn">← Home</a>
        <div class="title">Live 1v1 Battle</div>
        <div style="width: 50px;"></div>
      </div>

      <input type="text" id="playerNameInput" class="input-box" placeholder="Enter Your Name (e.g. Tauhid)" maxlength="15" />

      <div class="section-label">Select Subject</div>
      <div class="subject-grid">
        <div class="subject-card active" onclick="selectSubject('science', this)">
          <span class="sub-icon">🔬</span>
          <span class="sub-name">Science</span>
        </div>
        <div class="subject-card" onclick="selectSubject('maths', this)">
          <span class="sub-icon">📐</span>
          <span class="sub-name">Maths</span>
        </div>
        <div class="subject-card" onclick="selectSubject('english', this)">
          <span class="sub-icon">📖</span>
          <span class="sub-name">English</span>
        </div>
        <div class="subject-card" onclick="selectSubject('sst', this)">
          <span class="sub-icon">🌍</span>
          <span class="sub-name">SST</span>
        </div>
      </div>

      <div class="radar-box" id="radarAnim" style="display: none;">
        <span class="radar-icon">⚔️</span>
      </div>

      <h2 id="matchStatus" style="font-size: 16px; margin-bottom: 6px;">Ready to Battle</h2>
      <p id="matchDetail" style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">Match with another live student online</p>

      <button class="action-btn" id="startMatchBtn" onclick="startMatchmaking()">Find Live Opponent ➔</button>

      <!-- Timeout / Fallback Options -->
      <div id="fallbackArea" style="display: none; margin-top: 15px;">
        <button class="action-btn" style="background: #22c55e;" onclick="shareWhatsAppInvite()">📲 Invite Friend on WhatsApp</button>
        <button class="action-btn secondary-btn" onclick="startBotMatch()">🤖 Play Practice Round</button>
      </div>
    </div>

    <!-- 2. ACTIVE LIVE BATTLE SCREEN -->
    <div id="viewBattle" style="display: none;">
      <div class="battle-header">
        <div class="player-card">
          <span class="player-name" id="myDisplayName">You</span>
          <span class="player-score" id="myScore">0</span>
        </div>
        <span class="vs-badge">VS</span>
        <div class="player-card">
          <span class="player-name" id="opponentDisplayName">Opponent</span>
          <span class="player-score opponent-score" id="opponentScore">0</span>
        </div>
      </div>

      <div class="timer-pill" id="roundTimer">⏱️ Round Time: 10s</div>

      <div class="question-box">
        <div class="question-text" id="qText">Loading question...</div>
      </div>

      <div class="options-group" id="optionsContainer"></div>
    </div>

    <!-- 3. RESULT SCREEN -->
    <div id="viewBattleResult" style="display: none; padding: 20px 0;">
      <h1 id="resultBanner" style="font-size: 32px; margin-bottom: 10px;">🏆 VICTORY!</h1>
      <p id="resultSummary" style="color: #94a3b8; font-size: 14px; margin-bottom: 24px;">You won the duel!</p>
      
      <button class="action-btn" onclick="location.reload()">Play Another Match ⚔️</button>
    </div>

    <!-- Footer -->
    <div class="footer">
      Made with ❤️ by <span>Tauhid</span>
    </div>

  </div>

  <script src="ads.js"></script>

  <script>
    // ==========================================
    // 1. FIREBASE INITIALIZATION (Pre-filled)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyBZl5laCFj6wA2JwZt7qmP0bwbO5xMypJk",
      authDomain: "student-hub-c2235.firebaseapp.com",
      databaseURL: "https://student-hub-c2235-default-rtdb.firebaseio.com",
      projectId: "student-hub-c2235",
      storageBucket: "student-hub-c2235.firebasestorage.app",
      messagingSenderId: "250034335571",
      appId: "1:250034335571:web:f14eb04595091689f27ba6",
      measurementId: "G-SE2JY1V49V"
    };

    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (e) {
      console.warn("Firebase initialization error:", e);
    }

    // ==========================================
    // 2. QUESTION BANKS
    // ==========================================
    const questionBanks = {
      science: [
        { q: "What is the main constituent gas of Biogas (up to 75%)?", options: ["Methane (CH₄)", "Ethane", "Carbon dioxide", "Hydrogen"], answer: "Methane (CH₄)" },
        { q: "Minimum wind speed required for a wind turbine generator?", options: ["15 km/h", "5 km/h", "25 km/h", "50 km/h"], answer: "15 km/h" },
        { q: "Which element is used as a semiconductor in making solar cells?", options: ["Silicon (Si)", "Carbon (C)", "Aluminium (Al)", "Copper (Cu)"], answer: "Silicon (Si)" },
        { q: "Which mirror is used in solar cookers to concentrate sunlight?", options: ["Concave mirror", "Convex mirror", "Plane mirror", "Cylindrical mirror"], answer: "Concave mirror" },
        { q: "In a hydroelectric plant, which energy conversion takes place?", options: ["Potential → Kinetic → Electrical", "Chemical → Heat", "Nuclear → Mechanical", "Sound → Light"], answer: "Potential → Kinetic → Electrical" }
      ],
      maths: [
        { q: "What is the HCF of 135 and 225?", options: ["45", "15", "5", "9"], answer: "45" },
        { q: "What is the value of sin 30° + cos 60°?", options: ["1", "1/2", "√3/2", "0"], answer: "1" },
        { q: "If discriminant D > 0 in ax² + bx + c = 0, roots are:", options: ["Real and distinct", "Real and equal", "No real roots", "Imaginary only"], answer: "Real and distinct" },
        { q: "What is the 10th term of AP: 2, 7, 12, ...?", options: ["47", "50", "42", "52"], answer: "47" },
        { q: "Distance between points (0, 0) and (3, 4) is:", options: ["5 units", "7 units", "25 units", "1 unit"], answer: "5 units" }
      ],
      english: [
        { q: "Who is the author of 'A Letter to God'?", options: ["G.L. Fuentes", "Liam O'Flaherty", "Frederick Forsyth", "Roald Dahl"], answer: "G.L. Fuentes" },
        { q: "What did Lencho compare big drops of rain to?", options: ["Ten-cent pieces", "Five-cent pieces", "Silver coins", "Pearls"], answer: "Ten-cent pieces" },
        { q: "How much money was the postmaster able to send to Lencho?", options: ["70 pesos", "100 pesos", "50 pesos", "75 pesos"], answer: "70 pesos" },
        { q: "Who was described as 'an ox of a man' in First Flight?", options: ["Lencho", "The Postmaster", "The Postman", "Mijbil"], answer: "Lencho" },
        { q: "What did Lencho call the post office employees?", options: ["A bunch of crooks", "Kind angels", "Selfish men", "Helpers of God"], answer: "A bunch of crooks" }
      ],
      sst: [
        { q: "Who was proclaimed King of United Italy in 1861?", options: ["Victor Emmanuel II", "Giuseppe Mazzini", "Giuseppe Garibaldi", "Count Cavour"], answer: "Victor Emmanuel II" },
        { q: "Which soil is known as Regur soil and is ideal for cotton?", options: ["Black Soil", "Alluvial Soil", "Red Soil", "Laterite Soil"], answer: "Black Soil" },
        { q: "Which system of power sharing is followed in Belgium?", options: ["Community Government", "Majoritarianism", "Military Rule", "Monarchy"], answer: "Community Government" },
        { q: "What is the primary sector of Indian economy dependent on?", options: ["Agriculture & Natural resources", "Manufacturing factories", "IT & Banking", "Mining only"], answer: "Agriculture & Natural resources" },
        { q: "In which year was MGNREGA passed by the Government of India?", options: ["2005", "2002", "2010", "2015"], answer: "2005" }
      ]
    };

    // Game state variables
    let selectedSubject = 'science';
    let myPlayerName = "Player";
    let myPlayerId = "p_" + Math.random().toString(36).substr(2, 9);
    let myRole = "p1"; 
    let currentRoomId = null;
    let roomRef = null;

    let activeQuestions = [];
    let currentQ = 0;
    let myScoreVal = 0;
    let opponentScoreVal = 0;
    let roundTime = 10;
    let timerInterval = null;
    let searchTimeout = null;

    function selectSubject(sub, cardElement) {
      selectedSubject = sub;
      document.querySelectorAll('.subject-card').forEach(c => c.classList.remove('active'));
      cardElement.classList.add('active');
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // ==========================================
    // 3. REAL-TIME MATCHMAKING ENGINE
    // ==========================================
    function startMatchmaking() {
      const input = document.getElementById("playerNameInput").value.trim();
      myPlayerName = input || "Player " + Math.floor(Math.random() * 900 + 100);

      document.getElementById("startMatchBtn").style.display = "none";
      document.getElementById("radarAnim").style.display = "flex";
      document.getElementById("matchStatus").textContent = `Looking for ${selectedSubject.toUpperCase()} Player...`;
      document.getElementById("matchDetail").textContent = "Connecting to live matchmaking queue...";

      if (!db) {
        setTimeout(() => startBotMatch(), 3000);
        return;
      }

      const queueRef = db.ref(`queue/${selectedSubject}`);

      searchTimeout = setTimeout(() => {
        document.getElementById("radarAnim").style.display = "none";
        document.getElementById("matchStatus").textContent = "No Players Online Right Now";
        document.getElementById("matchDetail").textContent = "Invite a classmate or start a practice round!";
        document.getElementById("fallbackArea").style.display = "block";
      }, 15000);

      queueRef.transaction(currentQueue => {
        if (!currentQueue) {
          myRole = "p1";
          currentRoomId = "room_" + Math.random().toString(36).substr(2, 9);
          return {
            roomId: currentRoomId,
            hostId: myPlayerId,
            hostName: myPlayerName
          };
        } else {
          myRole = "p2";
          currentRoomId = currentQueue.roomId;
          return null;
        }
      }, (error, committed, snapshot) => {
        if (error) {
          console.error("Matchmaking error:", error);
          startBotMatch();
        } else if (committed && snapshot.val()) {
          listenAsHost(currentRoomId);
        } else {
          joinAsGuest(currentRoomId);
        }
      });
    }

    function listenAsHost(roomId) {
      roomRef = db.ref(`rooms/${roomId}`);
      activeQuestions = shuffleArray(questionBanks[selectedSubject]).slice(0, 5);

      roomRef.set({
        questions: activeQuestions,
        p1: { name: myPlayerName, score: 0 },
        p2: null,
        status: "waiting"
      });

      roomRef.onDisconnect().remove();

      roomRef.on("value", snapshot => {
        const data = snapshot.val();
        if (data && data.p2 && data.status === "waiting") {
          clearTimeout(searchTimeout);
          roomRef.update({ status: "playing" });
          initLiveMatch(data.p1.name, data.p2.name);
        }
      });
    }

    function joinAsGuest(roomId) {
      clearTimeout(searchTimeout);
      roomRef = db.ref(`rooms/${roomId}`);

      roomRef.once("value").then(snapshot => {
        const data = snapshot.val();
        if (data) {
          activeQuestions = data.questions;
          roomRef.update({
            p2: { name: myPlayerName, score: 0 },
            status: "playing"
          });
          initLiveMatch(data.p1.name, myPlayerName);
        }
      });
    }

    // ==========================================
    // 4. LIVE BATTLE LOOP & SYNC
    // ==========================================
    function initLiveMatch(p1Name, p2Name) {
      document.getElementById("viewMatchmaking").style.display = "none";
      document.getElementById("viewBattle").style.display = "block";

      const myNameElem = document.getElementById("myDisplayName");
      const oppNameElem = document.getElementById("opponentDisplayName");

      if (myRole === "p1") {
        myNameElem.textContent = `👤 ${p1Name}`;
        oppNameElem.textContent = p2Name;
      } else {
        myNameElem.textContent = `👤 ${p2Name}`;
        oppNameElem.textContent = p1Name;
      }

      if (roomRef) {
        roomRef.on("value", snapshot => {
          const data = snapshot.val();
          if (!data) return;
          const oppScore = (myRole === "p1") ? data.p2?.score : data.p1?.score;
          if (oppScore !== undefined) {
            opponentScoreVal = oppScore;
            document.getElementById("opponentScore").textContent = opponentScoreVal;
          }
        });
      }

      currentQ = 0;
      myScoreVal = 0;
      loadRound();
    }

    function loadRound() {
      clearInterval(timerInterval);

      if (currentQ >= activeQuestions.length) {
        finishBattle();
        return;
      }

      roundTime = 10;
      document.getElementById("roundTimer").textContent = `⏱️ Round Time: ${roundTime}s`;

      const q = activeQuestions[currentQ];
      document.getElementById("qText").textContent = `Q${currentQ + 1}: ${q.q}`;

      const container = document.getElementById("optionsContainer");
      container.innerHTML = "";

      const shuffledOpts = shuffleArray(q.options);
      shuffledOpts.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.textContent = opt;
        btn.onclick = () => answerQuestion(btn, opt, q.answer);
        container.appendChild(btn);
      });

      timerInterval = setInterval(() => {
        roundTime--;
        document.getElementById("roundTimer").textContent = `⏱️ Round Time: ${roundTime}s`;
        if (roundTime <= 0) {
          clearInterval(timerInterval);
          currentQ++;
          loadRound();
        }
      }, 1000);
    }

    function answerQuestion(btn, selected, correct) {
      clearInterval(timerInterval);
      const buttons = document.querySelectorAll(".opt-btn");
      buttons.forEach(b => b.disabled = true);

      if (selected === correct) {
        btn.classList.add("correct");
        myScoreVal += 100 + (roundTime * 5);
        document.getElementById("myScore").textContent = myScoreVal;

        if (roomRef) {
          const updateObj = {};
          updateObj[`${myRole}/score`] = myScoreVal;
          roomRef.update(updateObj);
        }
      } else {
        btn.classList.add("wrong");
        buttons.forEach(b => {
          if (b.textContent === correct) b.classList.add("correct");
        });
      }

      setTimeout(() => {
        currentQ++;
        loadRound();
      }, 1000);
    }

    function finishBattle() {
      document.getElementById("viewBattle").style.display = "none";
      document.getElementById("viewBattleResult").style.display = "block";

      const banner = document.getElementById("resultBanner");
      const summary = document.getElementById("resultSummary");

      if (myScoreVal > opponentScoreVal) {
        banner.textContent = "🏆 VICTORY!";
        banner.style.color = "#4ade80";
        summary.textContent = `You won! Final Score: ${myScoreVal} vs ${opponentScoreVal}`;
      } else if (myScoreVal === opponentScoreVal) {
        banner.textContent = "🤝 IT'S A TIE!";
        banner.style.color = "#facc15";
        summary.textContent = `Equal Score: ${myScoreVal} - ${opponentScoreVal}`;
      } else {
        banner.textContent = "💀 DEFEAT";
        banner.style.color = "#f87171";
        summary.textContent = `Opponent won! Final Score: ${myScoreVal} vs ${opponentScoreVal}`;
      }

      if (roomRef && myRole === "p1") {
        setTimeout(() => roomRef.remove(), 5000);
      }
    }

    // ==========================================
    // 5. FALLBACK / BOT SIMULATION
    // ==========================================
    function startBotMatch() {
      clearTimeout(searchTimeout);
      activeQuestions = shuffleArray(questionBanks[selectedSubject]).slice(0, 5);
      
      const bots = ["Aarav (Delhi)", "Priya (Mumbai)", "Sneha (Bangalore)", "Rohit (Kolkata)"];
      const botName = bots[Math.floor(Math.random() * bots.length)];
      
      initLiveMatch(myPlayerName, botName);

      setInterval(() => {
        if (Math.random() < 0.75 && document.getElementById("viewBattle").style.display === "block") {
          opponentScoreVal += 100;
          document.getElementById("opponentScore").textContent = opponentScoreVal;
        }
      }, 4000);
    }

    function shareWhatsAppInvite() {
      const url = window.location.href;
      const text = `⚔️ I am waiting for a 1v1 battle on Student Hub (${selectedSubject.toUpperCase()})! Click to play against me: ${url}`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }
  </script>
</body>
</html>
