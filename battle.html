      font-size: 14px;
      font-weight: 600;

      border: none;

      border: 1px solid #38bdf8;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
    }

    .input-box {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
      text-align: center;

    .section-label {

      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
      text-align: left;

      gap: 12px;
      margin-bottom: 20px;
    }

      background: #0f172a;
      border: 1px solid #334155;
      padding: 14px 10px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;

    .sub-icon { font-size: 24px; }
    .sub-name { font-size: 13px; font-weight: 700; color: #f8fafc; }

    /* MATCHMAKING RADAR */
    .radar-box {
      margin: 24px auto;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.1);
      border: 2px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 1.5s infinite;

    .radar-icon { font-size: 34px; }

      70% { box-shadow: 0 0 0 24px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }

      align-items: center;

      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 20px;

      flex-direction: column;
      align-items: center;

      font-weight: 700;

      font-weight: 600;
      color: #f8fafc;
      line-height: 1.5;

      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;

      padding: 13px 15px;

      font-size: 14px;
      text-align: left;

      font-weight: 500;

      color: #0f172a;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;

      font-size: 13px;
      color: #64748b;
      font-weight: 500;

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }

function listenAsHost(roomId) {
  roomRef = db.ref(`rooms/${roomId}`);
  activeQuestions = shuffleArray(questionBanks[selectedSubject]).slice(0, 5);
  roomRef.set({
    questions: activeQuestions,
    p1: { name: myPlayerName, score: 0 },
    p2: null,
    status: "waiting"
  });
  roomRef.onDisconnect().remove();
  roomRef.on("value", snapshot => {
    const data = snapshot.val();
    if (data && data.p2 && data.status === "waiting") {
      clearTimeout(searchTimeout);
      roomRef.update({ status: "playing" });
      initLiveMatch(data.p1.name, data.p2.name);
    }
  });
}

function joinAsGuest(roomId) {
  clearTimeout(searchTimeout);
  roomRef = db.ref(`rooms/${roomId}`);
  roomRef.once("value").then(snapshot => {
    const data = snapshot.val();
    if (data) {
      activeQuestions = data.questions;
      roomRef.update({
        p2: { name: myPlayerName, score: 0 },
        status: "playing"
      });
      initLiveMatch(data.p1.name, myPlayerName);
    }
  });
}

      document.getElementById("viewMatchmaking").style.display = "none";
      document.getElementById("viewBattle").style.display = "block";

      const myNameElem = document.getElementById("myDisplayName");
      const oppNameElem = document.getElementById("opponentDisplayName");

      if (myRole === "p1") {
        myNameElem.textContent = `👤 ${p1Name}`;
        oppNameElem.textContent = p2Name;
      } else {
        myNameElem.textContent = `👤 ${p2Name}`;
        oppNameElem.textContent = p1Name;
      }

      if (roomRef) {
        roomRef.on("value", snapshot => {
          const data = snapshot.val();
          if (!data) return;
          const oppScore = (myRole === "p1") ? data.p2?.score : data.p1?.score;
          if (oppScore !== undefined) {
            opponentScoreVal = oppScore;
            document.getElementById("opponentScore").textContent = opponentScoreVal;
          }
        });
      }

      currentQ = 0;
      myScoreVal = 0;
      loadRound();
    }

    function loadRound() {
      clearInterval(timerInterval);

      if (currentQ >= activeQuestions.length) {
        finishBattle();
        return;
      }

      roundTime = 10;
      document.getElementById("roundTimer").textContent = `⏱️ Round Time: ${roundTime}s`;

      const q = activeQuestions[currentQ];
      document.getElementById("qText").textContent = `Q${currentQ + 1}: ${q.q}`;

      const container = document.getElementById("optionsContainer");
      container.innerHTML = "";

      const shuffledOpts = shuffleArray(q.options);
      shuffledOpts.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.textContent = opt;
        btn.onclick = () => answerQuestion(btn, opt, q.answer);
        container.appendChild(btn);
      });

      timerInterval = setInterval(() => {
        roundTime--;
        document.getElementById("roundTimer").textContent = `⏱️ Round Time: ${roundTime}s`;
        if (roundTime <= 0) {
          clearInterval(timerInterval);
          currentQ++;
          loadRound();
        }
      }, 1000);
    }

    function answerQuestion(btn, selected, correct) {
      clearInterval(timerInterval);
      const buttons = document.querySelectorAll(".opt-btn");
      buttons.forEach(b => b.disabled = true);

      if (selected === correct) {
        btn.classList.add("correct");
        myScoreVal += 100 + (roundTime * 5);
        document.getElementById("myScore").textContent = myScoreVal;

        if (roomRef) {
          const updateObj = {};
          updateObj[`${myRole}/score`] = myScoreVal;
          roomRef.update(updateObj);
        }
      } else {
        btn.classList.add("wrong");
        buttons.forEach(b => {
          if (b.textContent === correct) b.classList.add("correct");
        });
      }

      setTimeout(() => {
        currentQ++;
        loadRound();
      }, 1000);
    }

    function finishBattle() {
      document.getElementById("viewBattle").style.display = "none";
      document.getElementById("viewBattleResult").style.display = "block";

      const banner = document.getElementById("resultBanner");
      const summary = document.getElementById("resultSummary");

      if (myScoreVal > opponentScoreVal) {
        banner.textContent = "🏆 VICTORY!";
        banner.style.color = "#4ade80";
        summary.textContent = `Excellent performance! Final Score: ${myScoreVal} vs ${opponentScoreVal}`;
      } else if (myScoreVal === opponentScoreVal) {
        banner.textContent = "🤝 IT'S A TIE!";
        banner.style.color = "#facc15";
        summary.textContent = `Balanced Duel: ${myScoreVal} - ${opponentScoreVal}`;
      } else {
        banner.textContent = "💀 DEFEAT";
        banner.style.color = "#f87171";
        summary.textContent = `Better luck next time! Final Score: ${myScoreVal} vs ${opponentScoreVal}`;
      }

      if (roomRef && myRole === "p1") {
        setTimeout(() => roomRef.remove(), 5000);
      }
    }

    // ==========================================
    // 5. BOT OPPONENT SIMULATION (Assam Towns)
    // ==========================================
    function startBotMatch() {
      clearTimeout(searchTimeout);
      activeQuestions = shuffleArray(questionBanks[selectedSubject]).slice(0, 5);
      
      const assamBots = [
        "Abhinav (Guwahati)", 
        "Debojit (Silchar)", 
        "Ananya (Dibrugarh)", 
        "Partha (Jorhat)", 
        "Sneha (Nagaon)", 
        "Rupam (Tezpur)"
      ];
      const botName = assamBots[Math.floor(Math.random() * assamBots.length)];
      
      initLiveMatch(myPlayerName, botName);

      setInterval(() => {
        if (Math.random() < 0.75 && document.getElementById("viewBattle").style.display === "block") {
          opponentScoreVal += 100;
          document.getElementById("opponentScore").textContent = opponentScoreVal;
        }
      }, 4000);
    }

    function shareWhatsAppInvite() {
      const url = window.location.href;
      const text = `⚔️ Challenge me in a live 1v1 SEBA Class 10 Quiz Battle on Student Hub (${selectedSubject.toUpperCase()})! Click to enter duel: ${url}`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }
  </script>
